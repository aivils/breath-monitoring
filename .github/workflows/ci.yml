name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: app_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      DB_NAME: app_test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_URL: redis://127.0.0.1:6379/1
      SECRET_KEY_BASE: test_secret_key_base
      DEVISE_JWT_SECRET_KEY: test_devise_jwt_secret_key_please_change
      RECAPTCHA_SITE_KEY: test
      RECAPTCHA_SECRET_KEY: test
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.7
          bundler-cache: true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client libmysqlclient-dev

      - name: Wait for MySQL
        run: |
          for i in {1..10}; do
            mysqladmin ping -h 127.0.0.1 -ppassword && break
            sleep 2
          done

      - name: Setup database
        run: bundle exec rails db:prepare

      - name: Run specs
        run: bundle exec rspec --format documentation
